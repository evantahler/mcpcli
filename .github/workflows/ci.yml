name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bash scripts/apply-transformers-patch.sh
      - run: bun lint
      - run: bun test

  test-upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - name: Test upgrade pathways
        run: bash test/e2e/test-upgrade.sh

  complete:
    runs-on: ubuntu-latest
    needs: [test, test-upgrade]
    if: always()
    steps:
      - name: Fail if any required job failed or was skipped
        if: ${{ needs.test.result != 'success' || needs.test-upgrade.result != 'success' }}
        run: |
          echo "test=${{ needs.test.result }} test-upgrade=${{ needs.test-upgrade.result }}"
          exit 1
      - run: echo "All checks passed"
